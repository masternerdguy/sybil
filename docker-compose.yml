services:
  dev-inspector:
    build:
      dockerfile: Dockerfile.devinspector
    networks:
      static-network:
        ipv4_address: 172.20.128.100
  herd-memory:
    image: localhost/herdmate
    env_file:
      - .env
    volumes:
      - ./ollama:/root/.ollama
    networks:
      static-network:
        ipv4_address: 172.20.128.2
networks:
  static-network:
    ipam:
      config:
        - subnet: 172.20.0.0/16
